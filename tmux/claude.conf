# tmux/claude.conf: the Claude Code parts of tmux, sourced from ~/.tmux.conf by setup-tmux.sh.
# One window per session, titled by the session (hooks/session-title.sh), with a live state glyph:
#   ◐  busy: a turn is running, or an agent or shell it started still runs after it
#   ✳  (green) waiting for you: a dialog is open (a permission prompt or a question, a
#      subagent's too; not idle_prompt), or the turn's last reply asks you for something
# hooks/tmux-state.sh sets @claude_state per window from Claude Code's hooks, hooks/stop-ring.sh
# at each Stop (it asks Haiku, through hooks/wants_input.py, whether the reply wants you), and
# tmux-claude-status (run below while a client is attached) clears it when Claude exits and
# fills it for a session that was already running. It also maps each background session to the
# client pane in its directory, so that session's own hooks can set the window. The status bar
# also shows the delegation token from `delegation-ledger watch --summary`: "2▶ 1⚠" = 2 live
# delegated agents, 1 past a liveness threshold; nothing when none.
# A ★ right after the window number marks a starred tab (claude-saved's pane option @claude_star, read through
# the window's active pane): claude-saved keeps a starred or shelved chat on the
# shelf (right-click a tab, or Ctrl-b S) so it can be reopened after its tab closes.

# --- titles: let each Claude report its own -------------------------------------------------
set -g set-titles on
set -g set-titles-string "#S · #{pane_title}"
setw -g automatic-rename off    # don't clobber the app-set title with the running command name
set -g allow-passthrough on     # carry Claude's desktop notifications through to the outer terminal
# tmux 3.7+ forwards Claude's OSC 9;4 progress to the outer tab as a ring, but only to terminals
# that advertise the feature. Windows Terminal isn't auto-detected, so force it.
set -as terminal-features ',xterm-256color:progressbar'

# --- status bar: up to 5 rows of tabs, grouped by project, title + state glyph --------------
# tmux-tab-bar (run by the hooks below and by tmux-claude-status) writes each session's rows: a
# repo with lanes gets its own row, its header first (`dotclaude▸`), then the lead's tab, its
# lanes and its other worktrees; every other window shares the last row(s). Every row starts
# with the same gutter: the delegation token's width (row 0 shows it), then the widest header
# (a laned row shows its own, dimmed after its first row), so every row's first tab starts in
# the same column. A tab has a fixed width (the numbers live in tmux-tab-bar), left-justified,
# with a dim │ between two tabs; a row too full for that splits evenly, and a tab spills to a new
# row only when it would get too narrow. Widths come from counts and the client's width, so a
# title change never moves a tab. Past 5 rows the bar ends in `+N` (click: the window list). A
# narrow client (the phone) gets short slots and the bar at the bottom. The global settings
# below are what a session shows before its first layout (tmux's own single row, from the two
# entry formats below) and what row 0 reuses: status-left, which
# runs the backstop and shows only the delegation token, padded to its length so row 0's tabs
# don't shift as the token changes; and status-right, the host and the clock (Hayden, 2026-10-13:
# the host moved right so row 0's tabs start near the left edge).
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=colour236,fg=colour250"
set -g status-left " #(~/.local/bin/tmux-claude-status)"
set -g status-left-length 8
set -g status-right " #{=10:host_short}  %a %H:%M "
set -g status-right-length 22
set -g window-status-separator ""
# Strip Claude's own ✳ title prefix (the glyph already shows state); other panes are untouched.
# The ★ goes before the state glyph: Windows Terminal draws ✳ two cells wide over the space after
# it, so a ★ after it would be overlapped.
setw -g window-status-format         " #I #{?@claude_star,★ ,}#{?#{==:#{@claude_state},busy},◐ ,#{?#{==:#{@claude_state},wait},#[fg=colour46]✳ #[fg=colour250],}}#{?pane_title,#{=/22/…:#{s/✳ //:#{s/^(.{128#}).+$/\\1/:pane_title}}},#{pane_current_command}} "
setw -g window-status-current-format "#[bg=colour24,fg=colour231,bold] #I #{?@claude_star,★ ,}#{?#{==:#{@claude_state},busy},◐ ,#{?#{==:#{@claude_state},wait},#[fg=colour46]✳ #[fg=colour231],}}#{?pane_title,#{=/30/…:#{s/✳ //:#{s/^(.{128#}).+$/\\1/:pane_title}}},#{pane_current_command}} "
setw -g window-status-current-style "bold"

# Re-lay out the bar when what it shows changes: a client attaches, leaves, resizes or switches
# session (switch-client fires only client-session-changed), a window opens or closes, or the
# current window changes (that matters only when `+N` hides windows; an unchanged layout writes
# nothing). tmux-claude-status catches the rest (a cwd change, a lane opened or closed). Index [43] for all of them, so a hook of your own keeps [0]. Full path:
# tmux's PATH lacks ~/.local/bin. Each one is silent and exits 0 whatever happens (no script, a
# crash): a run-shell -b that prints or fails puts the active pane into view mode to show it.
set-hook -g client-attached[43] 'run-shell -b "[ -x $HOME/.local/bin/tmux-tab-bar ] && $HOME/.local/bin/tmux-tab-bar layout >/dev/null 2>&1; true"'
set-hook -g client-detached[43] 'run-shell -b "[ -x $HOME/.local/bin/tmux-tab-bar ] && $HOME/.local/bin/tmux-tab-bar layout >/dev/null 2>&1; true"'
set-hook -g client-resized[43] 'run-shell -b "[ -x $HOME/.local/bin/tmux-tab-bar ] && $HOME/.local/bin/tmux-tab-bar layout >/dev/null 2>&1; true"'
set-hook -g window-linked[43] 'run-shell -b "[ -x $HOME/.local/bin/tmux-tab-bar ] && $HOME/.local/bin/tmux-tab-bar layout >/dev/null 2>&1; true"'
set-hook -g window-unlinked[43] 'run-shell -b "[ -x $HOME/.local/bin/tmux-tab-bar ] && $HOME/.local/bin/tmux-tab-bar layout >/dev/null 2>&1; true"'
set-hook -g after-new-window[43] 'run-shell -b "[ -x $HOME/.local/bin/tmux-tab-bar ] && $HOME/.local/bin/tmux-tab-bar layout >/dev/null 2>&1; true"'
set-hook -g session-window-changed[43] 'run-shell -b "[ -x $HOME/.local/bin/tmux-tab-bar ] && $HOME/.local/bin/tmux-tab-bar layout >/dev/null 2>&1; true"'
set-hook -g client-session-changed[43] 'run-shell -b "[ -x $HOME/.local/bin/tmux-tab-bar ] && $HOME/.local/bin/tmux-tab-bar layout >/dev/null 2>&1; true"'
# No hook for a moved or swapped window: move-window to an index already fires window-linked
# and window-unlinked, while swap-window and move-window -r (renumber) fire nothing in tmux
# 3.7c (it has no after-swap-window or after-move-window), so those reach the bar with
# tmux-claude-status's poll, within about 4 s.

# Where every menu and popup here opens (-y). tmux 3.7c masks a menu or popup out of a pane's
# redraw at the line's window y, not its screen y (screen_redraw_draw_pane), so with the bar on
# top the mask sits one row too high per bar row. A pane that redraws whole (Claude Code's
# synchronized output does it every frame, a long scroll too) then paints over the overlay's
# first rows, as many as the bar has: the tap menu lost its Star row. Only an overlay whose top
# is row 0 escapes (its unmasked rows are then bar rows), so with the bar on top they open at
# row 0, a tab's menu still at that tab's x. With the bar at the bottom (the phone) the two y's
# agree, and they open where tmux puts them. The value is -y's bottom edge, so 0 means the top.
set -g @overlay_y_tab '#{?#{==:#{status-position},top},0,#{popup_window_status_line_y}}'
set -g @overlay_y_centre '#{?#{==:#{status-position},top},0,#{popup_centre_y}}'

# Tap (or click) a tab: another tab switches to it, the tab you are on opens its menu (below),
# and `+N` opens the window list. It acts on the release, not the press, and the menu has no -O:
# a touch tap has no hover, so a stay-open menu would take the item tap as a miss, and a menu
# opened on the press would close on that press's release. Elsewhere on the bar, a tap does
# what tmux's default press did. The menu's Move… opens tmux-tab-bar's Move menu (◀ ▶ ▲ ▼, New
# row, which a shared tab's sits just above the shared rows, Name row…, Auto place), which reopens
# after each move until a tap outside it; Name row… (dim outside a custom row, here and there)
# names the tab's custom row. Its prompt template must stay a quoted string with
# %%%: that stores any typed text literally in a window option (quotes, ;, #[, %, $(…) and \ all
# checked), where the script reads it, so the text never passes through a shell. The { } form
# doesn't keep it literal.
#
# Drag a tab onto another tab or row. tmux keeps no press position at a drag's end (the
# release's =, mouse_x and line describe where it ends), so the press records the pressed tab in
# the session option @tab_bar_drag. A release on a tab puts the dragged tab before or after it
# (by which half of the slot, or the other side when a row would redraw its lines and only that
# keeps it on the line let go on); on a row's gutter or empty tail, first or last in that row; on
# the tab it started on (a jittery tap), it is a tap. A press records what it hit (a tab's id,
# `more` for +N), and every other press (the gutter, status-left or right, a pane, a border)
# clears it, as does every tap and drop, so a flag left by a release tmux never reported can't
# turn a later drag into a drop.
bind -n MouseDown1Status set -F @tab_bar_drag '#{?#{==:#{mouse_status_range},window},#{window_id},#{mouse_status_range}}'
bind -n MouseDown1StatusDefault set -u @tab_bar_drag
bind -n MouseDown1StatusLeft set -u @tab_bar_drag
bind -n MouseDown1StatusRight set -u @tab_bar_drag
bind -n MouseUp1Status {
  set -u @tab_bar_drag
  if -F '#{==:#{mouse_status_range},more}' {
    choose-tree -Zw
  } {
    if -F '#{!=:#{mouse_status_range},window}' {
      switch-client -t =
    } {
      if -F -t = '#{window_active}' {
        display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y '#{E:@overlay_y_tab}' \
          "#{?@claude_state,,-}#{?@claude_star,Unstar,Star}" '*' { run-shell "$HOME/.local/bin/claude-saved star #{pane_id} #{client_name}" } \
          "#{?@claude_state,,-}Shelve" v { run-shell "$HOME/.local/bin/claude-saved shelve #{pane_id} #{client_name}" } \
          "Shelf…" S { run-shell "$HOME/.local/bin/claude-saved menu #{client_name}" } \
          "Replies before pass" P { display-popup -E -w 80% -h 85% -y '##{E:@overlay_y_centre}' -T " replies before the pass (q to close) " "$HOME/.local/bin/pass-last #{pane_id}" } \
          '' \
          "Move…" m { run-shell '"$HOME/.local/bin/tmux-tab-bar" menu "#{client_name}" "#{window_id}" >/dev/null 2>&1; true' } \
          "#{?@tab_row_custom,,-}Name row…" N { command-prompt -p "row name:" "set -w @tab_row_name_in \"%%%\" ; run-shell '\"$HOME/.local/bin/tmux-tab-bar\" name-row \"#{client_name}\" >/dev/null 2>&1; true'" } \
          Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
          "Windows…" w { choose-tree -Zw }
      } {
        switch-client -t =
      }
    }
  }
}

# The drag's end: on the tab it started on, exactly the tap above (the same menu, written twice;
# a test keeps the copies equal); from +N back onto +N, the window list (a jittery tap there);
# from a tab, a drop; from anywhere else, nothing. No -b: two quick drops queue.
bind -n MouseDragEnd1Status {
  if -F '#{&&:#{==:#{mouse_status_range},window},#{==:#{@tab_bar_drag},#{window_id}}}' {
    set -u @tab_bar_drag
      if -F -t = '#{window_active}' {
        display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y '#{E:@overlay_y_tab}' \
          "#{?@claude_state,,-}#{?@claude_star,Unstar,Star}" '*' { run-shell "$HOME/.local/bin/claude-saved star #{pane_id} #{client_name}" } \
          "#{?@claude_state,,-}Shelve" v { run-shell "$HOME/.local/bin/claude-saved shelve #{pane_id} #{client_name}" } \
          "Shelf…" S { run-shell "$HOME/.local/bin/claude-saved menu #{client_name}" } \
          "Replies before pass" P { display-popup -E -w 80% -h 85% -y '##{E:@overlay_y_centre}' -T " replies before the pass (q to close) " "$HOME/.local/bin/pass-last #{pane_id}" } \
          '' \
          "Move…" m { run-shell '"$HOME/.local/bin/tmux-tab-bar" menu "#{client_name}" "#{window_id}" >/dev/null 2>&1; true' } \
          "#{?@tab_row_custom,,-}Name row…" N { command-prompt -p "row name:" "set -w @tab_row_name_in \"%%%\" ; run-shell '\"$HOME/.local/bin/tmux-tab-bar\" name-row \"#{client_name}\" >/dev/null 2>&1; true'" } \
          Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
          "Windows…" w { choose-tree -Zw }
      } {
        switch-client -t =
      }
  } {
    if -F '#{&&:#{==:#{mouse_status_range},more},#{==:#{@tab_bar_drag},more}}' {
      set -u @tab_bar_drag
      choose-tree -Zw
    } {
      if -F '#{m:@*,#{@tab_bar_drag}}' {
        run-shell '"$HOME/.local/bin/tmux-tab-bar" drop "#{@tab_bar_drag}" "#{window_id}" "#{mouse_x}" "#{mouse_status_line}" "#{mouse_status_range}" "#{client_name}" >/dev/null 2>&1; true'
      }
      set -u @tab_bar_drag
    }
  }
}
bind -n MouseDragEnd1StatusDefault {
  run-shell '"$HOME/.local/bin/tmux-tab-bar" drop-row "#{@tab_bar_drag}" "#{mouse_x}" "#{mouse_status_line}" "#{client_name}" >/dev/null 2>&1; true'
  set -u @tab_bar_drag
}
# The pane guard: a drag that leaves the bar over a pane would hit tmux's default MouseDrag1Pane,
# which starts copy mode, swallows the release and copies the text it crossed. While a tab drag
# is on, the pane drag does nothing and its release just clears the flag; otherwise both do what
# tmux 3.7c does (its MouseDrag1Pane default, inside the guard; it has no MouseDragEnd1Pane
# default, and send-keys -M keeps a mouse-mode app's release). A pane already in copy mode looks
# a mouse key up in the mode's table first, so both copy tables get the same guard around their
# own defaults. A press on a pane or a border (root and copy tables), and a border drag's
# release, clear the flag first and then do what tmux does. A test pins each wrapped default
# to a bare server's list-keys.
bind -n MouseDrag1Pane if -F '#{==:#{@tab_bar_drag},}' { if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -M } }
bind -n MouseDragEnd1Pane if -F '#{@tab_bar_drag}' { set -u @tab_bar_drag } { send-keys -M }
bind -n MouseDown1Pane { set -u @tab_bar_drag ; select-pane -t = ; send-keys -M }
bind -n MouseDown1Border { set -u @tab_bar_drag ; select-pane -M }
bind -n MouseDragEnd1Border set -u @tab_bar_drag
bind -T copy-mode MouseDown1Pane { set -u @tab_bar_drag ; select-pane }
bind -T copy-mode-vi MouseDown1Pane { set -u @tab_bar_drag ; select-pane }
bind -T copy-mode MouseDrag1Pane if -F '#{==:#{@tab_bar_drag},}' { select-pane ; send-keys -X begin-selection }
bind -T copy-mode MouseDragEnd1Pane if -F '#{@tab_bar_drag}' { set -u @tab_bar_drag } { send-keys -X copy-pipe-and-cancel }
bind -T copy-mode-vi MouseDrag1Pane if -F '#{==:#{@tab_bar_drag},}' { select-pane ; send-keys -X begin-selection }
bind -T copy-mode-vi MouseDragEnd1Pane if -F '#{@tab_bar_drag}' { set -u @tab_bar_drag } { send-keys -X copy-pipe-and-cancel }

# Shift+arrows move through the tabs as the bar draws them, not by window number (these replace
# base.conf's previous-window and next-window): Left and Right in reading order, past a row's
# end to the next row and from the last tab to the first; Up and Down to the tab above or below
# (the one under the current tab's first cell, else the nearest), wrapping between the top and
# bottom rows, which tmux draws top to bottom even with the phone's bar at the bottom. A window
# hidden in `+N` steps by number for Left and Right; Up and Down stay put. run-shell's command is a format, so #{client_name}
# names the client that pressed the key. No -b: the client's queue waits for each nav, so quick
# presses or key repeat each take a step from the window the one before chose (with -b, navs
# raced and read the same window). Silent and exits 0, like the hooks above. Without the
# script, Left and Right fall back to window order and Up and Down do nothing. These keys never
# reach a pane's program.
bind -n S-Left if-shell '[ -x "$HOME/.local/bin/tmux-tab-bar" ]' { run-shell '"$HOME/.local/bin/tmux-tab-bar" nav left "#{client_name}" >/dev/null 2>&1; true' } { previous-window }
bind -n S-Right if-shell '[ -x "$HOME/.local/bin/tmux-tab-bar" ]' { run-shell '"$HOME/.local/bin/tmux-tab-bar" nav right "#{client_name}" >/dev/null 2>&1; true' } { next-window }
bind -n S-Up if-shell '[ -x "$HOME/.local/bin/tmux-tab-bar" ]' { run-shell '"$HOME/.local/bin/tmux-tab-bar" nav up "#{client_name}" >/dev/null 2>&1; true' }
bind -n S-Down if-shell '[ -x "$HOME/.local/bin/tmux-tab-bar" ]' { run-shell '"$HOME/.local/bin/tmux-tab-bar" nav down "#{client_name}" >/dev/null 2>&1; true' }
# Shift+arrows go, Ctrl-b Shift+arrows carry: the current tab moves left or right in its row
# (nothing at either end), or up or down onto the row above or below, next to the tab Shift+Up
# or Shift+Down would go to, on that tab's line (nothing at the top or bottom). -r: after one
# Ctrl-b, each Shift+arrow within repeat-time carries again. No -b, as for nav: the client's
# queue runs one move at a time, and each lays out before it returns (waiting for a hook's
# layout in flight), so each move sees the bar the one before it drew. These replace tmux's
# default Ctrl-b Shift+arrow (pan a window larger than its client), which aggressive-resize
# leaves unused here.
bind -r S-Left if-shell '[ -x "$HOME/.local/bin/tmux-tab-bar" ]' { run-shell '"$HOME/.local/bin/tmux-tab-bar" move left "#{client_name}" >/dev/null 2>&1; true' }
bind -r S-Right if-shell '[ -x "$HOME/.local/bin/tmux-tab-bar" ]' { run-shell '"$HOME/.local/bin/tmux-tab-bar" move right "#{client_name}" >/dev/null 2>&1; true' }
bind -r S-Up if-shell '[ -x "$HOME/.local/bin/tmux-tab-bar" ]' { run-shell '"$HOME/.local/bin/tmux-tab-bar" move up "#{client_name}" >/dev/null 2>&1; true' }
bind -r S-Down if-shell '[ -x "$HOME/.local/bin/tmux-tab-bar" ]' { run-shell '"$HOME/.local/bin/tmux-tab-bar" move down "#{client_name}" >/dev/null 2>&1; true' }

# --- restore after tmux dies: reopen the Claude tabs main had ------------------------------
# hooks/session-registry.sh records each open tab and its server; when main is created on a
# new server (after a reboot, `wsl --terminate` or `tmux kill-server`),
# claude-restore reopens each one as `claude --resume <id>` in its directory, with the session's
# --model and --effort (docs/lanes.md, "Model and effort"). Any other session is a no-op;
# `claude-restore --list` shows what it would do. Index [42] keeps a session-created
# hook of your own; #{q:...} shell-quotes the name. Full path: tmux's PATH lacks ~/.local/bin.
# Silent and exits 0 like the [43] hooks: with no claude-restore, a failing run-shell -b put a
# pane in view mode.
set-hook -g session-created[42] 'run-shell -b "[ -x $HOME/.local/bin/claude-restore ] && $HOME/.local/bin/claude-restore --auto #{q:session_name} >/dev/null 2>&1; true"'

# --- star and shelve: keep a chat reachable after its tab closes ---------------------------
# Right-click a tab: tmux 3.7c's own window menu (from `tmux list-keys`), with its Swap Left and
# Swap Right as Move ◀ and Move ▶ (tmux-tab-bar moves the clicked tab in its row; swapping
# window numbers means nothing to a bar that orders tabs itself) and no Swap Marked, then Star (a
# bookmark: the tab shows ★ and the chat stays on the shelf until unstarred, however the tab
# closes), Shelve (save the chat and close its tab now) and Shelf… (the saved chats, newest
# first; Ctrl-b S opens it too). Star and Shelve are dim where no Claude runs (@claude_state
# unset). claude-saved finds the tab's chat and answers on the status line of the client that
# asked. Full path: tmux's PATH lacks ~/.local/bin. Tapping the tab you are on opens a shorter
# menu with the same four Claude items (tests/setup/test_tmux_tab_bar.py keeps them equal).
bind -n MouseDown3Status display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y '#{E:@overlay_y_tab}' \
  "#{?#{>:#{session_windows},1},,-}Move ◀" l { run-shell '"$HOME/.local/bin/tmux-tab-bar" move left "#{client_name}" "#{window_id}" >/dev/null 2>&1; true' } \
  "#{?#{>:#{session_windows},1},,-}Move ▶" r { run-shell '"$HOME/.local/bin/tmux-tab-bar" move right "#{client_name}" "#{window_id}" >/dev/null 2>&1; true' } \
  '' \
  Kill X { kill-window } \
  Respawn R { respawn-window -k } \
  "#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
  Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
  '' \
  "New After" w { new-window -a } \
  "New At End" W { new-window } \
  '' \
  "#{?@claude_state,,-}#{?@claude_star,Unstar,Star}" '*' { run-shell "$HOME/.local/bin/claude-saved star #{pane_id} #{client_name}" } \
  "#{?@claude_state,,-}Shelve" v { run-shell "$HOME/.local/bin/claude-saved shelve #{pane_id} #{client_name}" } \
  "Shelf…" S { run-shell "$HOME/.local/bin/claude-saved menu #{client_name}" } \
  "Replies before pass" P { display-popup -E -w 80% -h 85% -y '##{E:@overlay_y_centre}' -T " replies before the pass (q to close) " "$HOME/.local/bin/pass-last #{pane_id}" }
bind S run-shell "$HOME/.local/bin/claude-saved menu #{client_name}"

# --- the replies before a /pass --------------------------------------------------------------
# A plain /pass respawns the pane, so what the old session said leaves the screen. The new
# session shows the last turn's replies once as a banner; Ctrl-b Up (and "Replies before pass"
# in the right-click, tap and Ctrl-b Enter menus) shows the last 5 turns in a popup, opened at the
# last one (tmux/pass-last; q closes).
# tmux's man page doesn't call a popup's command a format, so this binding passes no pane and
# pass-last asks tmux for the current one; a menu item's command is expanded, so the menus pass it.
# Ctrl-b Up, which replaces tmux's default select-pane -U (Hayden, 2026-10-12: Ctrl-b P needed
# Shift, and lowercase p is previous-window); Ctrl-b P stays as an alias.
bind Up display-popup -E -w 80% -h 85% -y '#{E:@overlay_y_centre}' -T " replies before the pass (q to close) " "$HOME/.local/bin/pass-last"
bind P display-popup -E -w 80% -h 85% -y '#{E:@overlay_y_centre}' -T " replies before the pass (q to close) " "$HOME/.local/bin/pass-last"

# --- Alt+V: paste a screenshot or file that came from another device -------------------------
# Under WSL, Claude Code's Ctrl+V reads this PC's Windows clipboard, so an image copied on a
# laptop or phone never arrives. Alt+V pastes the path of the newest image or file that reached
# this PC in the last 10 minutes (the laptop/ uploader's inbox, or Downloads, where Taildrop
# saves; images only there) as a bracketed paste: Claude Code attaches an image, and reads any
# other file with Read (tmux/paste-inbox). The laptop's Ctrl+V on an image or a copied file
# uploads it and sends Alt+V itself. run-shell's command is a format, so
# #{pane_id} and #{client_name} name the pane and the client that pressed the key (a target
# argument like display-message -c isn't expanded). No -b: a quick second press waits for the
# first. Silent and exits 0, like the keys above. Without the script, the key reaches the pane;
# with it, a pane's own program (less, nano, an editor) no longer gets Alt+V.
bind -n M-v if-shell '[ -x "$HOME/.local/bin/paste-inbox" ]' { run-shell '"$HOME/.local/bin/paste-inbox" paste "#{pane_id}" "#{client_name}" >/dev/null 2>&1; true' } { send-keys M-v }
