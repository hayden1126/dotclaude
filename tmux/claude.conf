# tmux/claude.conf: the Claude Code parts of tmux, sourced from ~/.tmux.conf by setup-tmux.sh.
# One window per session, titled by the session (hooks/session-title.sh), with a live state glyph:
#   ◐  busy: a turn is running
#   ✳  (green) waiting for you: a permission prompt or a question (not idle_prompt: a session
#      idle on a background shell is not waiting on you; settings.json matches the Notification)
# hooks/tmux-state.sh sets @claude_state per window from Claude Code's hooks, and
# tmux-claude-status (run below while a client is attached) clears it when Claude exits and
# fills it for a session that was already running. It also maps each background session to the
# client pane in its directory, so that session's own hooks can set the window. The status bar
# also shows the delegation token from `delegation-ledger watch --summary`: "2▶ 1⚠" = 2 live
# delegated agents, 1 past a liveness threshold; nothing when none.
# A ★ before the title marks a starred tab: claude-saved keeps a starred or shelved chat on the
# shelf (right-click a tab, or Ctrl-b S) so it can be reopened after its tab closes.

# --- titles: let each Claude report its own -------------------------------------------------
set -g set-titles on
set -g set-titles-string "#S · #{pane_title}"
setw -g automatic-rename off    # don't clobber the app-set title with the running command name
set -g allow-passthrough on     # carry Claude's desktop notifications through to the outer terminal
# tmux 3.7+ forwards Claude's OSC 9;4 progress to the outer tab as a ring, but only to terminals
# that advertise the feature. Windows Terminal isn't auto-detected, so force it.
set -as terminal-features ',xterm-256color:progressbar'

# --- status bar: one entry per window, title + state glyph ----------------------------------
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=colour236,fg=colour250"
set -g status-left " #h #(~/.local/bin/tmux-claude-status)"
set -g status-left-length 28
set -g status-right " %a %H:%M "
set -g status-right-length 16
set -g window-status-separator ""
# Strip Claude's own ✳ title prefix (the glyph already shows state); other panes are untouched.
setw -g window-status-format         " #I #{?#{==:#{@claude_state},busy},◐ ,#{?#{==:#{@claude_state},wait},#[fg=colour46]✳ #[fg=colour250],}}#{?@claude_star,★ ,}#{?pane_title,#{=/22/…:#{s/✳ //:pane_title}},#{pane_current_command}} "
setw -g window-status-current-format "#[bg=colour24,fg=colour231,bold] #I #{?#{==:#{@claude_state},busy},◐ ,#{?#{==:#{@claude_state},wait},#[fg=colour46]✳ #[fg=colour231],}}#{?@claude_star,★ ,}#{?pane_title,#{=/30/…:#{s/✳ //:pane_title}},#{pane_current_command}} "
setw -g window-status-current-style "bold"

# --- restore after tmux dies: reopen the Claude tabs main had ------------------------------
# hooks/session-registry.sh records each open tab and its server; when main is created on a
# new server (after a reboot, `wsl --terminate` or `tmux kill-server`),
# claude-restore reopens each one as `claude --resume <id>` in its directory (any other session
# is a no-op; `claude-restore --list` shows what it would do). Index [42] keeps a session-created
# hook of your own; #{q:...} shell-quotes the name. Full path: tmux's PATH lacks ~/.local/bin.
set-hook -g session-created[42] 'run-shell -b "$HOME/.local/bin/claude-restore --auto #{q:session_name}"'

# --- star and shelve: keep a chat reachable after its tab closes ---------------------------
# Right-click a tab: tmux 3.7c's own window menu (verbatim from `tmux list-keys`), then Star (a
# bookmark: the tab shows ★ and the chat stays on the shelf until unstarred, however the tab
# closes), Shelve (save the chat and close its tab now) and Shelf… (the saved chats, newest
# first; Ctrl-b S opens it too). Star and Shelve are dim where no Claude runs (@claude_state
# unset). claude-saved finds the tab's chat and answers on the status line of the client that
# asked. Full path: tmux's PATH lacks ~/.local/bin.
bind -n MouseDown3Status display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W \
  "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } \
  "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } \
  "#{?pane_marked_set,,-}Swap Marked" s { swap-window } \
  '' \
  Kill X { kill-window } \
  Respawn R { respawn-window -k } \
  "#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
  Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
  '' \
  "New After" w { new-window -a } \
  "New At End" W { new-window } \
  '' \
  "#{?@claude_state,,-}#{?@claude_star,Unstar,Star}" '*' { run-shell "$HOME/.local/bin/claude-saved star #{pane_id} #{client_name}" } \
  "#{?@claude_state,,-}Shelve" v { run-shell "$HOME/.local/bin/claude-saved shelve #{pane_id} #{client_name}" } \
  "Shelf…" S { run-shell "$HOME/.local/bin/claude-saved menu #{client_name}" }
bind S run-shell "$HOME/.local/bin/claude-saved menu #{client_name}"
