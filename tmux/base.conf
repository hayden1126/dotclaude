# tmux/base.conf: general tmux preferences for driving several Claude repos, one window each,
# from more than one device. Optional: `setup-tmux.sh --base` sources it from ~/.tmux.conf
# (later plain runs keep it; `--no-base` removes it).
# Reload after editing: Ctrl-b r.

# --- basics ----------------------------------------------------------------------------------
set -g mouse on                 # tap a window or pane to focus it; drag or two-finger to scroll
set -g history-limit 50000      # deep scrollback for long Claude transcripts
set -g base-index 1             # windows count from 1 (matches the number row)
setw -g pane-base-index 1
set -g renumber-windows on      # close a window and the rest renumber, no gaps
set -sg escape-time 10          # snappy ESC for editors and TUIs
set -g focus-events on
set -g set-clipboard on         # yank to the client's clipboard (OSC 52)

# Each device connects in its own (grouped) session, so a window sizes to the device viewing it
# instead of clamping every client down to the smallest screen.
setw -g aggressive-resize on

# --- bindings (prefix is Ctrl-b) -------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"   # Ctrl-b r
bind | split-window -h -c "#{pane_current_path}"                  # Ctrl-b |  side-by-side split
bind - split-window -v -c "#{pane_current_path}"                  # Ctrl-b -  stacked split
bind c new-window -c "#{pane_current_path}"                       # new window keeps the current dir
bind -n S-Left  previous-window                                   # Shift+Left/Right, no prefix
bind -n S-Right next-window

# Ctrl-b Enter: a keyboard action menu. Right-click menus (from `mouse on`) don't reliably reach
# tmux over a laptop trackpad, so the same menu engine gets a key. Enter was unbound by default.
bind Enter display-menu -T " tmux " -x C -y C \
  "New window"          n "new-window -c \"#{pane_current_path}\"" \
  "Rename window"       , "command-prompt -I \"#W\" \"rename-window -- '%%'\"" \
  "" \
  "Split right"         | "split-window -h -c \"#{pane_current_path}\"" \
  "Split down"          - "split-window -v -c \"#{pane_current_path}\"" \
  "" \
  "Scroll / copy mode"  [ "copy-mode" \
  "" \
  "Detach"              d "detach-client" \
  "Reload config"       r "source-file ~/.tmux.conf" \
  "Kill window"         x "confirm-before -p \"kill #W? (y/n)\" kill-window"

# Ctrl-b h: a curated key cheatsheet (Ctrl-b ? stays tmux's raw list); q or Esc closes it.
bind h display-popup -E -w 80% -h 85% -T " tmux keys (q to close) " "less ~/.tmux-cheatsheet.txt"
