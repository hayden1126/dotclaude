# tmux/base.conf: general tmux preferences for driving several Claude repos, one window each,
# from more than one device. Optional: `setup-tmux.sh --base` sources it from ~/.tmux.conf
# (later plain runs keep it; `--no-base` removes it).
# Reload after editing: Ctrl-b r.

# --- basics ----------------------------------------------------------------------------------
set -g mouse on                 # tap a window or pane to focus it; drag or two-finger to scroll
set -g history-limit 50000      # deep scrollback for long Claude transcripts
set -g base-index 1             # windows count from 1 (matches the number row)
setw -g pane-base-index 1
set -g renumber-windows on      # close a window and the rest renumber, no gaps
set -sg escape-time 10          # snappy ESC for editors and TUIs
set -g focus-events on
set -g set-clipboard on         # yank to the client's clipboard (OSC 52)

# Each device connects in its own (grouped) session, so a window sizes to the device viewing it
# instead of clamping every client down to the smallest screen.
setw -g aggressive-resize on

# --- bindings (prefix is Ctrl-b) -------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"   # Ctrl-b r
bind | split-window -h -c "#{pane_current_path}"                  # Ctrl-b |  side-by-side split
bind - split-window -v -c "#{pane_current_path}"                  # Ctrl-b -  stacked split
bind c new-window -c "#{pane_current_path}"                       # new window keeps the current dir
# Shift+Left/Right, no prefix: by window number. claude.conf, sourced after this, binds all four
# Shift+arrows to follow the tab bar's layout instead (tmux-tab-bar nav).
bind -n S-Left  previous-window
bind -n S-Right next-window

# Ctrl-b Enter: a keyboard action menu. Right-click menus (from `mouse on`) don't reliably reach
# tmux over a laptop trackpad, so the same menu engine gets a key. Enter was unbound by default.
# Its Claude items are claude-saved's (tmux/claude.conf): Star, Shelve and the Shelf, with
# no Shift needed (Ctrl-b S is easy to send as Ctrl-b s, tmux's session picker), then the
# replies before a /pass (tmux/pass-last; Ctrl-b Up in claude.conf opens it too). Move… is the
# tab bar's Move menu (claude.conf's tmux-tab-bar), and Reset bar puts every tab of this session
# back where the bar would place it by itself. With the bar on top, this menu and the popups
# open at row 0: tmux 3.7c draws a busy pane over an overlay's first rows anywhere else
# (claude.conf explains). A menu item's command is expanded when the menu opens, so the
# popup's -y inside one doubles its #s to reach display-popup intact.
bind Enter display-menu -T " tmux " -x C -y '#{?#{==:#{status-position},top},0,#{popup_centre_y}}' \
  "New window"          n "new-window -c \"#{pane_current_path}\"" \
  "Rename window"       , "command-prompt -I \"#W\" \"rename-window -- '%%'\"" \
  "" \
  "Split right"         | "split-window -h -c \"#{pane_current_path}\"" \
  "Split down"          - "split-window -v -c \"#{pane_current_path}\"" \
  "" \
  "Scroll / copy mode"  [ "copy-mode" \
  "" \
  "Detach"              d "detach-client" \
  "Reload config"       r "source-file ~/.tmux.conf" \
  "Kill window"         x "confirm-before -p \"kill #W? (y/n)\" kill-window" \
  "" \
  "Move…"               m "run-shell \"$HOME/.local/bin/tmux-tab-bar menu #{client_name} >/dev/null 2>&1; true\"" \
  "Reset bar"           R "confirm-before -p \"put every tab back where the bar places it? (y/n)\" \"run-shell '$HOME/.local/bin/tmux-tab-bar reset #{client_name} >/dev/null 2>&1; true'\"" \
  "" \
  "#{?@claude_state,,-}#{?@claude_star,Unstar chat,Star chat}" * "run-shell \"$HOME/.local/bin/claude-saved star #{pane_id} #{client_name}\"" \
  "#{?@claude_state,,-}Shelve chat" v "run-shell \"$HOME/.local/bin/claude-saved shelve #{pane_id} #{client_name}\"" \
  "Shelf…"              S "run-shell \"$HOME/.local/bin/claude-saved menu #{client_name}\"" \
  "Replies before pass" P "display-popup -E -w 80% -h 85% -y '##{?##{==:##{status-position},top},0,##{popup_centre_y}}' -T \" replies before the pass (q to close) \" \"$HOME/.local/bin/pass-last #{pane_id}\""

# Ctrl-b h: a curated key cheatsheet (Ctrl-b ? stays tmux's raw list); q or Esc closes it.
bind h display-popup -E -w 80% -h 85% -y '#{?#{==:#{status-position},top},0,#{popup_centre_y}}' -T " tmux keys (q to close) " "less ~/.tmux-cheatsheet.txt"
