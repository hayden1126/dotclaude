<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-label="Every tool call a delegated agent makes passes the policy hook. Only Bash also enters the OS sandbox; file and MCP tools run outside it. The final report of each of the four roles passes the report check on its way to the lead. The ledger records starts, stops and denials, and only its audit flags the known write escape: a computed-path write into the main checkout.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrow-tap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#ffffff"/>

  <g font-family="'Ubuntu Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" fill="#18181b">

    <!-- Deny return, over the top: hook back to agent -->
    <path d="M340,49 V30 H100 V47" fill="none" stroke="#3f3f46" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="112" y="22" font-size="15" fill="#52525b">a denial comes back with an intent: stop, scope down, hand back</text>

    <!-- Delegated agent -->
    <rect x="20" y="50" width="160" height="410" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="100" y="80" font-size="18" font-weight="600" text-anchor="middle">Delegated agent</text>
    <text x="100" y="101" font-size="14" fill="#52525b" text-anchor="middle">subagent or teammate</text>
    <g text-anchor="end">
      <text x="168" y="145" font-size="16">Bash</text>
      <text x="168" y="205" font-size="15" fill="#c2410c" font-family="'Ubuntu Sans Mono', 'DejaVu Sans Mono', monospace">python3 -c …</text>
      <text x="168" y="255" font-size="16">file tools</text>
      <text x="168" y="275" font-size="14" fill="#52525b" font-family="'Ubuntu Sans Mono', 'DejaVu Sans Mono', monospace">Read Edit Grep</text>
      <text x="168" y="330" font-size="16">MCP tools</text>
      <text x="168" y="435" font-size="16">final report</text>
    </g>

    <!-- Agent to hook -->
    <line x1="180" y1="140" x2="228" y2="140" stroke="#3f3f46" stroke-width="1.75" marker-end="url(#arrow)"/>
    <line x1="180" y1="200" x2="228" y2="200" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-accent)"/>
    <line x1="180" y1="250" x2="228" y2="250" stroke="#3f3f46" stroke-width="1.75" marker-end="url(#arrow)"/>
    <line x1="180" y1="325" x2="228" y2="325" stroke="#3f3f46" stroke-width="1.75" marker-end="url(#arrow)"/>

    <!-- 1. Policy hook -->
    <rect x="230" y="50" width="220" height="310" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <circle cx="252" cy="78" r="12" fill="#334155"/>
    <text x="252" y="83" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="272" y="84" font-size="18" font-weight="600">Policy hook</text>
    <text x="246" y="108" font-size="15" fill="#52525b">PreToolUse, on every call</text>
    <text x="246" y="145" font-size="15">command rules, no opt-out</text>
    <text x="246" y="205" font-size="15" fill="#c2410c">can't read code: allowed</text>
    <text x="246" y="255" font-size="15">no credential paths, /proc</text>
    <text x="246" y="330" font-size="15">read-only MCP tools only</text>

    <!-- Hook to sandbox (Bash only) -->
    <line x1="450" y1="140" x2="498" y2="140" stroke="#3f3f46" stroke-width="1.75" marker-end="url(#arrow)"/>
    <line x1="450" y1="200" x2="498" y2="200" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-accent)"/>

    <!-- 2. Bash sandbox -->
    <rect x="500" y="98" width="190" height="134" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <circle cx="522" cy="124" r="12" fill="#334155"/>
    <text x="522" y="129" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="542" y="130" font-size="18" font-weight="600">Bash sandbox</text>
    <text x="516" y="153" font-size="15" fill="#52525b">OS-level, Bash only</text>
    <text x="516" y="177" font-size="15">writes: repo + temp</text>
    <text x="516" y="197" font-size="15">credentials: hidden</text>
    <text x="516" y="217" font-size="15">network: by host</text>

    <!-- File and MCP tools bypass the sandbox -->
    <line x1="450" y1="250" x2="738" y2="250" stroke="#3f3f46" stroke-width="1.75" marker-end="url(#arrow)"/>
    <line x1="450" y1="325" x2="738" y2="325" stroke="#3f3f46" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="476" y="293" font-size="15" font-style="italic" fill="#52525b">both run outside the sandbox</text>

    <!-- Sandbox to machine -->
    <line x1="690" y1="140" x2="738" y2="140" stroke="#3f3f46" stroke-width="1.75" marker-end="url(#arrow)"/>
    <line x1="690" y1="200" x2="758" y2="200" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-accent)"/>

    <!-- Targets -->
    <rect x="740" y="98" width="190" height="182" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="756" y="128" font-size="18" font-weight="600">Your machine</text>
    <text x="756" y="150" font-size="15" fill="#52525b">files, credentials,</text>
    <text x="756" y="168" font-size="15" fill="#52525b">network</text>
    <rect x="760" y="185" width="150" height="31" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <text x="835" y="206" font-size="15" font-weight="600" fill="#c2410c" text-anchor="middle">main checkout</text>
    <text x="835" y="236" font-size="14" fill="#c2410c" text-anchor="middle">inside the write root</text>

    <rect x="740" y="305" width="190" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="756" y="331" font-size="17" font-weight="600">MCP servers</text>

    <!-- Report row -->
    <line x1="180" y1="420" x2="498" y2="420" stroke="#3f3f46" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="196" y="411" font-size="15" fill="#52525b">final report (JSON block)</text>
    <line x1="500" y1="448" x2="182" y2="448" stroke="#3f3f46" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="196" y="474" font-size="15" fill="#52525b">malformed: sent back, at most twice</text>

    <rect x="500" y="400" width="190" height="60" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <circle cx="522" cy="422" r="12" fill="#334155"/>
    <text x="522" y="427" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="542" y="428" font-size="18" font-weight="600">Report check</text>
    <text x="516" y="450" font-size="15" fill="#52525b">my four roles only</text>

    <line x1="690" y1="430" x2="738" y2="430" stroke="#3f3f46" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="696" y="421" font-size="15" fill="#52525b">valid</text>
    <rect x="740" y="400" width="190" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="756" y="436" font-size="18" font-weight="600">Lead session</text>

    <!-- Taps into the ledger -->
    <line x1="100" y1="460" x2="100" y2="503" stroke="#a1a1aa" stroke-width="1.75" stroke-dasharray="2 4" stroke-linecap="round" marker-end="url(#arrow-tap)"/>
    <line x1="595" y1="460" x2="595" y2="503" stroke="#a1a1aa" stroke-width="1.75" stroke-dasharray="2 4" stroke-linecap="round" marker-end="url(#arrow-tap)"/>

    <!-- The escape, caught only by the audit -->
    <path d="M910,200 H958 V533 H942" fill="none" stroke="#c2410c" stroke-width="1.75" stroke-dasharray="2 4" stroke-linecap="round" marker-end="url(#arrow-accent)"/>

    <!-- 4. Ledger + audit -->
    <rect x="20" y="505" width="920" height="80" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <circle cx="44" cy="532" r="12" fill="#334155"/>
    <text x="44" y="537" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="64" y="538" font-size="18" font-weight="600">Ledger + audit</text>
    <text x="924" y="538" font-size="15" font-weight="600" fill="#c2410c" text-anchor="end">audit flags the escape, after the fact</text>
    <text x="40" y="566" font-size="15" fill="#52525b">records every start, stop, denial and report; reads transcripts to tell working from stuck</text>

    <!-- Legend -->
    <g font-size="15" fill="#52525b">
      <line x1="20" y1="604" x2="48" y2="604" stroke="#3f3f46" stroke-width="1.75"/>
      <text x="56" y="609">a call goes through</text>
      <line x1="210" y1="604" x2="238" y2="604" stroke="#a1a1aa" stroke-width="1.75" stroke-dasharray="2 4" stroke-linecap="round"/>
      <text x="246" y="609">recorded by the ledger</text>
      <line x1="420" y1="604" x2="448" y2="604" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="456" y="609">the known gap: a computed-path write by a writer</text>
    </g>
  </g>
</svg>
