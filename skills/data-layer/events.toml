# data-layer: the skill's entry for the practices hook (hooks/practices_check.py).
#
# No [[event]]: an L1 event is for a measured failure that is an absence no pattern can see and
# whose fix needs more than a deny line carries. A rename or a drop is a pattern, and REL-31's
# deny carries the fix, so the rule alone is enough. SPEC.md has the test and what would revisit it.
#
# `when` works line by line, since the commit scan reads added lines one at a time. It skips a
# line that starts with `-- `, `#` or `//`, since the first step of an add-then-remove may say what
# a later release drops, and otherwise matches anywhere on the line, since a Bash call may hold the
# statement mid-line (printf '...' > "$f"). It is a lookahead from the line's start, so a match
# that runs onto the next line leaves that line its own turn. Known misses: MySQL's `change a b`,
# and `drop a` alone on a continuation line (it reads like other statements there). Accepted false
# matches, each costing one resend: a comment after a statement, a `/* */` comment, a `--` with no
# space after it, an edit of part of a comment, `alter index x rename to y`, a temporary table's
# drop, and a down migration's drop.
# Samples for every form: tests/setup/practices_samples/data-layer.toml.

skill = "data-layer"

gate = [
  "Build add-then-remove by default for a column or table rename or drop, with the new code on the new name now, unless the repo proves the old release is gone first; say so in your reply (REL-31).",
]

[[rule]]
id = "REL-31"
paths = [
  "**/migrations/**",
  "**/migration/**",
  "**/migrate/**",
  "**/alembic/versions/**",
  "**/drizzle/**",
]
at = ["edit", "commit", "bash"]
# The Bash level has no path to match, so it reads these words in the command instead.
command = '''(?i)migrat|alembic|drizzle'''
when = '''(?ix)
  ^(?![^\S\n]*(?:--(?:\s|$)|\#|//))
  (?=[^\n]{0,4000}?
  (?:
    \brename\s+(?:column|table|to)\b
    | \bdrop\s+(?:column|table)\b
    # ALTER TABLE names a column bare. Everything after the keyword that isn't a column stays out.
    | \balter\s+table\b[^;\n]{0,200}?\brename\s+(?!constraint\b|index\b|key\b)
    | \balter\s+table\b[^;\n]{0,200}?\bdrop\s+
      (?!constraint\b|not\b|default\b|identity\b|expression\b|index\b|key\b|primary\b|foreign\b
         |check\b|partition\b)
    # `RENAME a TO b` alone on the line after ALTER TABLE, so prose mid-line passes.
    | ^[^\S\n]*rename\s+(?:"[^"\n]{1,128}"|`[^`\n]{1,128}`|\[[^\]\n]{1,128}\]|[\w$.]+)\s+to\b
    # Rails, and Alembic and Sequel.
    | \b(?:rename_column|remove_columns?|rename_table|drop_table|drop_join_table|drop_column)\b
    | \bremove_(?:references?|belongs_to|timestamps)\b
    # Rails inside a change_table block, whatever the block's variable is called.
    | \.(?:remove|rename)[\s(]+[:"']+\w
    # T-SQL.
    | \bsp_rename\b
    # Django.
    | \b(?:RenameField|RemoveField|RenameModel|DeleteModel)\b
    # Alembic's alter_column rename.
    | \bnew_column_name\s*=
    # Knex, TypeORM, Sequelize and Laravel.
    | \b(?:renameColumn|renameTable|removeColumn|dropColumns?|dropTable(?:IfExists)?)\b
    # Laravel.
    | \bdropIfExists\b
    | \bSchema::(?:rename|drop)\b
  ))
'''
say = "This migration renames or drops something the old release may still read, and migrations run before the new code is live. Build add-then-remove by default and say so in your reply: add the new column, keep both in sync in the database, move the new code to the new column now, and remove the old one in a later release. If this is the contract step, check the old release is gone, then resend or add `practices-allow: REL-31 <reason>`. A drop in a down migration is a false match: resend."
