# Geometry gate rules, evaluated by geometry.py over what geometry_probe.js
# measured. Every box is in canvas pixels (the deck's [canvas] size).
#
# A deck overrides these in its deck.toml, never by editing this file:
#
#   [geometry]
#   disable = ["clearance"]          # rule ids to skip
#   [geometry.text-overlap]
#   min_area = 10                    # any param below, plus severity/enabled
#
# severity: "error" fails the gate (exit 1); "warn" prints and exits 0.
# Every rule also takes `exempt`, a list of CSS selectors: a text item inside a
# match is skipped by that rule (for text that sits there by design).

[[rule]]
id = "text-overlap"
severity = "error"
enabled = true
# Line rects of two text items that are laid out independently intersect by
# more than min_area px², at least min_depth px deep on both axes.
# Never counted: an item against itself, its ancestors or its descendants, and
# two items in flow under the same positioned box (blocks, flex and grid items,
# inline runs): one layout pass places them and does not stack lines. Range
# rects are the font's content area, taller than a tight line-height, so a
# 2 px sliver between stacked lines is not ink on ink. Inside an svg nothing
# flows, so each <text> counts on its own.
min_area = 4
min_depth = 3

[[rule]]
id = "covers-marker"
severity = "error"
enabled = true
# CSS selectors for map pins and similar markers that text must not sit on.
markers = [".pin", "[data-geo=marker]"]
min_area = 0

[[rule]]
id = "unbounded-abs-text"
severity = "error"
enabled = true
# Small running text in an absolutely positioned box whose width its content
# decides. Measured, not inferred: the probe appends words to the text and
# checks whether the positioned box widens by more than tolerance px. Running
# text needs a declared measure; display type does not: large text (the WCAG
# thresholds below) and labels of at most label_chars characters (kickers,
# names) set their own width by design.
tolerance = 1
label_chars = 24
large_px = 24
large_bold_px = 18.66
bold_weight = 700

[[rule]]
id = "text-on-media"
severity = "error"
enabled = true
# Text over raster media (img, video, canvas, an svg holding an <image>, a
# url() background) with nothing painted between it and the picture. Vector
# svg (charts, leader lines) is not media. A panel or scrim is any element in
# the paint stack between the text and the media, its ::before/::after
# included, whose background color or strongest gradient stop reaches
# min_panel_alpha. Small text needs one. WCAG large text (large_px, or
# large_bold_px at bold_weight) may rely on a text-shadow instead.
min_panel_alpha = 0.35
large_px = 24
large_bold_px = 18.66
bold_weight = 700

[[rule]]
id = "safe-area"
severity = "warn"
enabled = true
# Text floating on the slide ground that runs into the canvas margin. "auto"
# reads the --margin-slide token off the section, else fallback_margin. Text on
# a painted panel that reaches a canvas edge (a side column, a band, at least
# panel_alpha opaque) is measured by that panel's own inset, so it is skipped.
margin = "auto"
fallback_margin = 96
tolerance = 2
panel_alpha = 0.35
# Source lines and decorative type sit in the margin on purpose.
exempt = ["footer.src", "[data-decor]"]

[[rule]]
id = "clearance"
severity = "warn"
enabled = true
# Two text items closer than min_gap px (em boxes) without overlapping. Only
# between items laid out independently (different positioned boxes): stacked
# blocks in one flow sit close by design, and so do labels inside one svg
# drawing, which its author placed against each other by coordinates.
min_gap = 8

[[rule]]
id = "clipped-text"
severity = "error"
enabled = true
# A text line that runs past an overflow:hidden/clip ancestor's box by more
# than this many px.
tolerance = 2
