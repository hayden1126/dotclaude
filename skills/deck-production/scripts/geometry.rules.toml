# Geometry gate rules, evaluated by geometry.py over what geometry_probe.js
# measured. Every box is in canvas pixels (the deck's [canvas] size).
#
# A deck overrides these in its deck.toml, never by editing this file:
#
#   [geometry]
#   disable = ["clearance"]          # rule ids to skip
#   [geometry.text-overlap]
#   min_area = 10                    # any param below, plus severity/enabled
#
# severity: "error" fails the gate (exit 1); "warn" prints and exits 0.
# Every rule also takes `exempt`, a list of CSS selectors: a text item inside a
# match is skipped by that rule (for text that sits there by design).
#
# "Ink" below is a text line's rect trimmed to the em box: a Range rect is the
# font's content area, taller than the glyphs, so stacked lines whose content
# areas touch do not collide on screen.

[[rule]]
id = "text-overlap"
severity = "error"
enabled = true
# The ink of two text items intersects by more than min_area px², at least
# min_depth px deep on both axes. In flow or not: an overflowing fixed-height
# card, a negative margin, a relative offset, a transform or two grid items in
# one cell all stack ink. Not compared: an item and the text nested in its own
# flow (an absolutely positioned descendant, a badge on a title, still
# counts), and lines one flow stacked: below the two items' common ancestor
# nothing is positioned, floated, transformed, offset, negatively margined or
# spilling out of a fixed size, and the two branches are one run of inline
# content or boxes that do not intersect. Those cannot collide; their em boxes
# overlap only by tight leading (a display headline at line-height .85). A
# shallower overlap is reported by `clearance`.
min_area = 4
min_depth = 3

[[rule]]
id = "covers-marker"
severity = "error"
enabled = true
# CSS selectors for map pins and similar markers that text must not sit on.
markers = [".pin", "[data-geo=marker]"]
min_area = 0

[[rule]]
id = "unbounded-abs-text"
severity = "error"
enabled = true
# Running text in an absolutely positioned box with no measure of its own.
# Measured, not inferred: the probe shortens and lengthens the text. A box
# that changes width with it and, lengthened, fills all the width available
# from its anchor (in every direction it grows: a box centered with
# translateX(-50%) grows both ways) is bounded by nothing of its own, wherever
# that anchor sits; one that stops short has a max-width, a width or insets. Headings (h1-h3) and labels of at most
# label_chars characters (kickers, names) set their own width by design. Font
# size is not the test: large text can still be a long unbounded caption.
label_chars = 24

[[rule]]
id = "text-contrast"
severity = "error"
enabled = true
# WCAG 2.x contrast, measured on pixels. The slide is screenshotted with the
# glyph fill forced black, white and invisible; everything else stays as
# rendered (text-shadows and SVG halos are part of what the glyph sits on;
# group opacity and overlays above the text are part of what reaches the
# reader). The rendered glyph color is judged against the backdrop under each
# glyph pixel, and the ratio at the given percentile of those pixels must
# reach min_small, or min_large for WCAG large text (large_px, or
# large_bold_px at bold_weight). A low percentile: a few stray dots do not
# fail a line, a band of bad backdrop does. Every visible text is measured,
# whatever is behind it: photos, video frames, reveal backgrounds, gradients.
#
# The bars default to WCAG AA. A deck may lower them in deck.toml, with a
# non-empty `reason` in the same table, printed on every run; at regulated
# rigor ([deck] rigor, or derived) a bar below AA is a config error.
percentile = 5
min_small = 4.5
min_large = 3.0
reason = ""
large_px = 24
large_bold_px = 18.66
bold_weight = 700
# Decorative type is meant to recede.
exempt = ["[data-decor]"]

[[rule]]
id = "safe-area"
severity = "warn"
enabled = true
# Text that runs into the canvas margin. "auto" reads the --margin-slide token
# (resolved by the browser, so rem, % and calc() work), else fallback_margin.
# Text on a painted panel (at least panel_alpha opaque) whose own box hugs the
# edge the text is near (a side column, a band) is measured by that panel's
# inset and skipped for that edge. A full-canvas panel excuses no edge.
margin = "auto"
fallback_margin = 96
tolerance = 2
panel_alpha = 0.35
# Source lines and decorative type sit in the margin on purpose.
exempt = ["footer.src", "[data-decor]"]

[[rule]]
id = "clearance"
severity = "warn"
enabled = true
# Two text items whose ink overlaps, shallower than text-overlap's min_depth
# (reported as overlapping, 0 px apart), for every pair text-overlap compares,
# svg labels and items in one positioned box included. A near miss, ink
# closer than min_gap px, only between items laid out independently
# (different positioned boxes): blocks in one box sit close by design, and so
# do the labels of one svg drawing, placed against each other by coordinates.
min_gap = 8

[[rule]]
id = "clipped-text"
severity = "error"
enabled = true
# A text line that runs past an overflow:hidden/clip ancestor's box by more
# than this many px.
tolerance = 2
