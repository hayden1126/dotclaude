# Dated reminders for delegation upkeep, read by `delegation-ledger due`.
#
# From its date on, each item is printed at every session start until it is removed from this
# file. Remove it in the same change as the work it asks for. This file is separate from
# policy.toml on purpose: the policy hook fails closed on a malformed policy.toml, and a typo
# in a reminder must never block a delegated agent. A malformed due.toml only silences the
# reminders (the error goes to delegation-ledger.err, and `delegation-ledger due` names it).
#
# [[item]]
# date = 2026-01-31          # a TOML date, no quotes
# do = "What to run, and what to change once it has run."

[[item]]
date = 2026-11-02
do = "Check the watch guard's re-arm live, by hand: claude -p kills background shells about 5 s after its final result, so the live harness can't hold a wait across turns. In an interactive session, start a detached `sleep 240` outside the sandbox (its pid must be the host's), and note its pid. Run `delegation-ledger wait --pid <pid> --max 0.5` with run_in_background, and see it exit 75 with a re-arm line. End the turn and see the watch guard block it once. Re-arm with the printed command, and see it exit 0 once the sleep ends. Also check that `claude --continue` keeps the session id: before quitting and after continuing, note both $CLAUDE_CODE_SESSION_ID and the sessionId in ~/.claude/sessions/$CLAUDE_PID.json (from a command run outside the sandbox), since a waiter's session comes from either and the watch guard's crash adoption rests on the id staying the same. Then move this date a month on, and run it again after each Claude Code upgrade."

[[item]]
date = 2026-11-02
do = "Check by hand that Claude Code's time-limit kill still spares a detached Codex: codex-delegate runs Codex under a double-forked supervisor, which escapes only because the kill takes the command's process tree by parent links (docs/delegation.md, the verified facts and the known gaps). In an interactive session, write a brief asking Codex to run `sleep 90` and then report, and launch `codex-delegate run --model terra --dir <a scratch dir> --brief <it>` with run_in_background and timeout 60000. When Claude Code kills it at 60 s, run `codex-delegate status <run_id>` outside the sandbox and see `running (its wrapper is gone; ...)` with the codex pid alive. Then run the `delegation-ledger wait --resume <watch_id>` from the launch line, with run_in_background and timeout 7200000, and see it exit 0 with a valid report and an `rc` of 0 in its stop row. If Codex died instead, the detach no longer works: see the known gap. Also check how Claude Code stops a command, since the wrapper passes SIGINT on to Codex: outside the sandbox, start `python3 -c 'import signal, sys, time; [signal.signal(s, lambda n, f: print(signal.Signals(n).name, time.time(), flush=True)) for s in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP)]; time.sleep(600)'` twice with run_in_background, stop one with TaskStop and give the other a 5000 ms timeout, and read their outputs: each should log SIGTERM only, never SIGINT, and be gone within a few seconds (a SIGKILL). Then move this date a month on, and run it again after each Claude Code upgrade."
