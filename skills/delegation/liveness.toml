# Liveness thresholds, in minutes. Read only by `delegation-ledger open` and `watch`.
# Fails open: a malformed file falls back to the defaults in delegation-ledger, and `open` and
# `watch` print a warning. Kept out of policy.toml, whose parse error blocks every delegated call.
# These are starting guesses: retune them from `delegation-ledger audit --monthly`.
[subagent]
silent_min = 15   # past the 10-min stall timer, so a ⚠ means the timer didn't fire
tool_min = 30     # inside one tool call
[teammate]
silent_min = 30
tool_min = 30
[codex]
silent_min = 30
