# auth-secrets: events and patterns for the practices hook (hooks/practices_check.py).
#
# [[event]] (L1): this edit is the event; the hook denies once until the skill is loaded.
#   Fires when any path glob matches the path relative to the project OR any content regex
#   matches the file as it will read after the edit.
# [[rule]] (L2): denies once per file and rule when `paths` (if given) match, `when` matches
#   the new text the edit writes, and neither `unless` nor a `practices-allow: <id> <reason>`
#   comment appears in the file as it will read after the edit.
# `at` (optional, on a [[rule]]): where the rule runs, "edit" and/or "commit" (the commit-time
#   scan of new commits, L3s). It defaults to both. SEC-41's `practices-allow` covers only the
#   line it sits on, so one allowed fixture can't hide a real key elsewhere in the file.
#
# Globs: `**` spans directories, `*` and `?` stay inside one, `{a,b}` alternates, and a
# glob with no `/` matches the basename. Regexes are Python, re.MULTILINE, with no quantifier
# inside a repeated group (no backtracking). A few span lines on purpose, always with a
# bounded window. No pattern holds a literal key: each describes the vendor's published shape.
# Samples for every event and rule: tests/setup/practices_samples/auth-secrets.toml, where
# `{key:<vendor>}` stands for a key-shaped value the test builds at run time.

skill = "auth-secrets"

# The gate lines stay near 600 characters in all: the post-compaction digest holds every
# loaded skill's gate in DIGEST_MAX (2,000) characters, and server-code's takes about 900.
gate = [
  "Build email or phone changes as pending until a hashed single-use link to the NEW address is followed (SEC-37).",
  "Build a same-origin check on each redirect param: strings only, no backslash or control character, stored paths start with exactly one / (SEC-39).",
  "Build sessions that rotate at sign-in, end at logout and expire server-side, not by Max-Age (SEC-33).",
  "Build reset, invite and OTP tokens from a CSPRNG: hashed, short-lived, single-use (SEC-36).",
  "Build secret reads from env, never key-shaped literals, with .env* gitignored (SEC-41).",
  "Build each safeguard unasked, name it in your reply, never offer it.",
]

[[event]]
id = "auth-flow"
paths = [
  "**/auth/**",
  "**/oauth/**",
  "**/{login,logout,signin,signout,sign-in,sign-out,signup,sign-up}/**",
  "**/{session,sessions}/**",
  "**/*{password,Password}*/**",
  "**/{account,settings}/{security,email,password,phone}/**",
  "auth.{ts,tsx,js,jsx,mjs,cjs,py,rb,go,php}",
  "auth.*.{ts,js,mjs}",
  "*.auth.{ts,js}",
  "{login,logout,signin,signup,session,sessions}.{ts,tsx,js,jsx,mjs,py,rb,go,php}",
  "*{password,Password}*.{ts,tsx,js,jsx,mjs,py,rb,go,php}",
  "middleware.{ts,js,mjs}",
  "**/middleware/**",
]
content = [
  # Server-side auth and session libraries.
  '''(?:\bfrom\s|\brequire\(\s*)\s*["'](?:next-auth|next-auth/[\w/-]+|@auth/[\w-]+|lucia|better-auth|better-auth/[\w/-]+|passport|passport-[\w-]+|iron-session|express-session|cookie-session|@fastify/session|@fastify/secure-session)["']''',
  '''^\s*(?:from|import)\s+(?:flask_login|django\.contrib\.auth|authlib|fastapi_users|flask_security)\b''',
]
lines = [
  "Build a new session id at sign-in and every privilege change, a logout that deletes the session server-side, and a server-side expiry for long or remembered sessions; say so in your reply (SEC-33).",
  "Build one answer for 'no such account' and 'wrong password', with similar timing; say so in your reply (SEC-32).",
  "Build a per-user and per-IP rate limit on sign-in, sign-up, reset and OTP, with the IP from the header your proxy sets; say so in your reply (server-code SEC-07).",
  "Build every post-sign-in redirect through a same-origin validator that returns an absolute URL; say so in your reply (SEC-39).",
  "Build any email or phone change as pending until the NEW address confirms it; say so in your reply (SEC-37).",
]

[[event]]
id = "password"
paths = []
content = [
  '''(?:\bfrom\s|\brequire\(\s*)\s*["'](?:bcrypt|bcryptjs|argon2|@node-rs/argon2|@node-rs/bcrypt|scrypt-js)["']''',
  '''^\s*(?:from|import)\s+(?:bcrypt|argon2|passlib)\b''',
  '''\b(?:hash|verify|compare|check|make|reset|update|change)_?[Pp]assword\b''',
  '''\bpassword_(?:hash|verify)\(''',
  '''\b(?:scrypt|scryptSync|pbkdf2|pbkdf2Sync|pbkdf2_hmac)\(''',
]
lines = [
  "Build password hashing with Argon2id (19 MiB, 2 iterations, parallelism 1) or bcrypt at cost 10 or more, never a fast hash; say so in your reply (SEC-30).",
  "Build the policy: at least 15 characters for a single-factor password (8 only as one factor of MFA), up to at least 64, no composition rules, a common-password check; say so in your reply (SEC-31).",
  "Build one answer for 'no such account' and 'wrong password', with similar timing; say so in your reply (SEC-32).",
  "Build a per-user and per-IP rate limit on sign-in, sign-up and reset; say so in your reply (server-code SEC-07).",
  "Build a password change that needs the current password, and make it or a reset end the user's other sessions and void any open email or phone change; say so in your reply (SEC-37, SEC-33).",
]

[[event]]
id = "session-cookie"
paths = []
content = [
  # A cookie set whose name (a literal or a constant) says session, auth or token; a CSRF or
  # XSRF cookie is not a session cookie.
  '''(?:\bcookies\(\)\)?\.set\(|\bcookies\.set\(|\.cookie\(|\.set_cookie\(|\bsetCookie\(\s*\w+\s*,|(?<![.\w])serialize\(|\bcookie\.serialize\()\s*(?:key\s*=\s*)?(?:["'`](?![^"'`\n]{0,60}?(?i:csrf|xsrf))[^"'`\n]{0,60}?(?i:session|\bsid\b|auth|token|jwt|refresh|remember)|(?![A-Z0-9_]{0,40}(?:CSRF|XSRF))[A-Z0-9_]{0,40}(?:SESSION|AUTH|TOKEN|SID|JWT|REMEMBER))''',
  '''(?i:set-cookie)["'`]?\s*[:,]\s*[`"'](?![^=`"'\n]{0,60}?(?i:csrf|xsrf))[^`"'\n]{0,60}?(?i:session|\bsid\b|auth|token|jwt|refresh|remember)''',
  '''^\s*SESSION_COOKIE_(?:SECURE|HTTPONLY|SAMESITE|AGE|DOMAIN|NAME)\s*=''',
  # A remembered or long-lived session: a remember-me flag, or a lifetime of days on a cookie
  # or token in a file that names a session.
  '''(?i:\bremember_?me\b)''',
  '''\A(?=[\s\S]*?(?i:session|\bsid\b))[\s\S]*?(?i:\b(?:max[-_]?age|expires)\b)["'`]?\s*[:=]\s*[^,;\n]{0,60}?(?:\b(?:86400|604800|1209600|2592000|31536000)\b|\*\s*24\b|\b24\s*\*|\bdays?\b|\bweeks?\b)''',
]
lines = [
  "Build the session cookie with Secure, HttpOnly, SameSite=Lax or Strict and the __Host- prefix; say so in your reply (SEC-34).",
  "Build a new session id at sign-in and every privilege change, and a logout that deletes the session server-side; say so in your reply (SEC-33).",
  "Build long or remembered sessions with an expiry and an idle limit stored on the session record and checked on every request, since a cookie's Max-Age or Expires only asks the browser; say so in your reply (SEC-33).",
  "Build token transport in a cookie or an Authorization header, never a URL; say so in your reply (SEC-34).",
]

[[event]]
id = "redirect-param"
paths = []
content = [
  '''(?:\.get\(\s*|\bquery\[\s*|\bargs\[\s*|\bparams\[\s*|\bbody\[\s*|\bparams\.fetch\(\s*)[\"'](?:next|returnTo|return_to|returnUrl|return_url|redirect|redirectTo|redirect_to|redirectUrl|redirect_url|redirect_uri|callbackUrl|callback_url)[\"']|\bparams(?:\[\s*|\.fetch\(\s*):(?:next|returnTo|return_to|returnUrl|return_url|redirect|redirectTo|redirect_to|redirectUrl|redirect_url|redirect_uri|callbackUrl|callback_url)\b''',
  '''\b(?:query|searchParams|args|params|body)\??\.(?:next|returnTo|return_to|returnUrl|return_url|redirect|redirectTo|redirect_to|redirectUrl|redirect_url|redirect_uri|callbackUrl|callback_url)\b''',
  # A destructured read, from the request, its body, the router or a bare (awaited) searchParams.
  '''\{[^}\n]{0,200}\b(?:next|returnTo|return_to|returnUrl|redirect|redirectTo|redirectUrl|callbackUrl)\b[^}\n]{0,200}\}\s*=\s*(?:await\s)?\s*(?:(?:req|request|ctx|event|context|props|router)\.|useRouter\(\)\.)?(?:query|searchParams|url\.searchParams|body)\b''',
]
lines = [
  "Build a redirect validator: one string only, no backslash or control character, parsed against the configured origin, origins compared; say so in your reply (SEC-39).",
  "Build the redirect to the validated absolute URL, never a bare path that can start with //; say so in your reply (SEC-39).",
  "Build an exact-match allowlist for external and OAuth redirect_uri targets; say so in your reply (SEC-39).",
  "Build tests for //, backslash, /.//host and tab/CR/LF values, plus a same-origin path with a query; say so in your reply (SEC-39).",
]

[[event]]
id = "contact-change"
paths = []
content = [
  '''\b(?:update|change)_?(?:Email|email|Phone|phone|PhoneNumber|phone_number)\b''',
  '''(?i:\bUPDATE\s+["`]?\w+["`]?\s+SET\s+(?:[^\n;]{0,200}?,\s*)?(?:\w+\.)?["`]?(?:email|phone|phone_number)["`]?\s*=)''',
  '''\b(?:request\.user|current_user|currentUser)\.(?:email|phone|phone_number|phoneNumber)\s*=(?!=)''',
  '''\.(?:set|update)\(\s*\{(?!\s*where\b)[^{}\n]{0,200}?\b(?:email|phone|phoneNumber|phone_number)\b\s*(?:[,}]|:(?!\s*(?:true|false|null)\b))''',
  '''\b(?:verifyBeforeUpdateEmail|updateEmail)\(|\.auth\.updateUser\(''',
]
lines = [
  "Build the change as pending: a random single-use token stored hashed, valid 30 minutes or less, mailed to the NEW address; switch only when it is followed; say so in your reply (SEC-37).",
  "Build a fresh sign-in or current-password check before the change starts; say so in your reply (SEC-37).",
  "Build a notice to the old address that the requester can't turn off, a rate limit and an audit line; say so in your reply (SEC-37, server-code SEC-07).",
  "Build tests: the address is unchanged until the link is followed, and a forged, reused or expired link changes nothing; say so in your reply (SEC-37).",
]

[[event]]
id = "jwt"
paths = []
content = [
  '''(?:\bfrom\s|\brequire\(\s*)\s*["'](?:jsonwebtoken|jose|jwt-decode|jwks-rsa|express-jwt|passport-jwt|@fastify/jwt|hono/jwt)["']''',
  '''^\s*(?:from|import)\s+(?:jwt|jose|jwcrypto|authlib\.jose)\b''',
  '''\b(?:jwt\.(?:sign|verify|decode|encode)|jwtVerify|decodeJwt|jwtDecode|jwt_decode|createRemoteJWKSet)\(|\bnew\s+SignJWT\(''',
  '''["']github\.com/golang-jwt/jwt''',
]
lines = [
  "Build verification before any claim is trusted: the signature with a key from a trusted source, an algorithm allowlist, and exp, nbf, iss and aud checks; say so in your reply (SEC-35).",
  "Build short-lived access tokens, and say in your reply how long one outlives a logout or a removal (SEC-33).",
  "Build the signing key from env or a secret manager, never a literal; say so in your reply (SEC-41).",
  "Build tests: alg none, tampered and expired tokens get 401; say so in your reply (SEC-35).",
]

[[event]]
id = "browser-policy"
paths = []
content = [
  '''(?i:access-control-allow-(?:origin|credentials)|content-security-policy|strict-transport-security)''',
  '''(?:\bfrom\s|\brequire\(\s*)\s*["'](?:cors|@fastify/cors|helmet|@fastify/helmet|hono/cors|hono/secure-headers)["']''',
  '''\bCORSMiddleware\b|^\s*(?:from|import)\s+(?:flask_cors|corsheaders)\b|\bCORS_ALLOW(?:ED_ORIGINS|_ALL_ORIGINS|_CREDENTIALS)\b''',
]
lines = [
  "Build CORS on fixed or allowlisted origins, never * or a reflected Origin with credentials; say so in your reply (SEC-43).",
  "Build CSP and egress allowlists from exact hosts plus their redirect targets, never *.domain; say so in your reply (SEC-43).",
  "Build the security headers: HSTS, a CSP with frame-ancestors, nosniff and a Referrer-Policy; say so in your reply (SEC-44).",
  "Build a header test on a live response; say so in your reply (SEC-44).",
]

[[event]]
id = "secret-env"
paths = []
content = [
  '''\b(?:process\.env|import\.meta\.env|Bun\.env)(?:\.|\[\s*["'])[A-Z0-9_]{0,60}(?:SECRET|TOKEN|PASSWORD|PRIVATE|CREDENTIAL|(?<![A-Z])KEY)''',
  '''\b(?:Deno\.env\.get|os\.getenv|os\.environ\.get|getenv|env|ENV\.fetch)\(\s*["'][A-Z0-9_]{0,60}(?:SECRET|TOKEN|PASSWORD|PRIVATE|CREDENTIAL|(?<![A-Z])KEY)''',
  '''\b(?:os\.environ|ENV)\[\s*["'][A-Z0-9_]{0,60}(?:SECRET|TOKEN|PASSWORD|PRIVATE|CREDENTIAL|(?<![A-Z])KEY)''',
]
lines = [
  "Build secret reads from env or a secret manager only, with no literal fallback value; say so in your reply (SEC-41).",
  "Build the key into server-only code: never a NEXT_PUBLIC_, VITE_ or PUBLIC_ variable, a client file, a URL or a prompt; say so in your reply (SEC-40).",
  "Build a startup check that fails closed when the secret is unset; say so in your reply (server-code SEC-08).",
  "Build .env* into .gitignore and commit only a .env.example with empty values; say so in your reply (SEC-41).",
  "Build dev to run without live keys that can send or post externally; say so in your reply (SEC-45).",
]

[[rule]]
# A fast hash on the same line as a password. A line that also names a slow hash (a SHA-256
# pre-hash before bcrypt) and a comment line stay quiet; a reset token hashed with SHA-256
# names no password, so it never fires. A file that queries Pwned Passwords (a SHA-1 range
# check, never storage) stays quiet.
id = "SEC-30"
unless = '''(?i:pwnedpasswords|haveibeenpwned|\bhibp)'''
when = '''^(?!\s*(?://|#|/?\*))(?![^\n]*(?i:bcrypt|argon2|scrypt|pbkdf2))[^\n]*(?:(?i:\b(?:md5|sha1|sha-1|sha224|sha256|sha-256|sha384|sha512|sha-512)\b)[^\n]{0,120}(?i:\b(?:password|passwd|pwd)\b)|(?i:\b(?:password|passwd|pwd)\b)[^\n]{0,120}(?i:\b(?:md5|sha1|sha256|sha512)\s*\())'''
paths = ["*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,py,rb,php,go}"]
say = "Build password hashing with Argon2id (19 MiB, 2 iterations, parallelism 1) or bcrypt at cost 10 or more; a fast hash such as MD5 or SHA-256 falls to a GPU in hours, salted or not (SEC-30). Code that only verifies legacy hashes to migrate them on sign-in can stay: add `practices-allow: SEC-30 legacy migration`."

[[rule]]
# A session cookie set without its flags. A CSRF or XSRF cookie never fires (double-submit needs
# it readable). The file clears it by naming HttpOnly, Secure and SameSite, or by passing a
# lowercase options object as an argument (sessionCookieOptions, ...cookieOpts; an imported
# CookieOptions type doesn't count), unless it also sets secure to false, SameSite to None, or
# httpOnly to false on a session-named cookie (on its line or inside its set call).
id = "SEC-34"
when = '''(?:\bcookies\(\)\)?\.set\(|\bcookies\.set\(|\.cookie\(|\.set_cookie\(|\bsetCookie\(\s*\w+\s*,|(?<![.\w])serialize\(|\bcookie\.serialize\()\s*(?:key\s*=\s*)?(?:["'`](?![^"'`\n]{0,60}?(?i:csrf|xsrf))[^"'`\n]{0,60}?(?i:session|\bsid\b|auth|token|jwt|refresh|remember)|(?![A-Z0-9_]{0,40}(?:CSRF|XSRF))[A-Z0-9_]{0,40}(?:SESSION|AUTH|TOKEN|SID|JWT|REMEMBER))|(?i:set-cookie)["'`]?\s*[:,]\s*[`"'](?![^=`"'\n]{0,60}?(?i:csrf|xsrf))[^`"'\n]{0,60}?(?i:session|\bsid\b|auth|token|jwt|refresh|remember)'''
unless = '''\A(?![\s\S]*?(?i:\bsecure[\"'`]?\s*[:=]\s*[\"'`]?(?:false|nil)\b|\bsamesite[\"'`]?\s*[:=]\s*[\"'`]?none\b)|[\s\S]*?^(?![^\n]*(?i:csrf|xsrf))(?=[^\n]*(?i:session|\bsid\b|auth|token|jwt|refresh|remember))[^\n]*(?i:\bhttp_?only)[\"'`]?\s*[:=]\s*[\"'`]?(?i:false|nil)\b|[\s\S]*?(?:\bcookies\(\)\)?\.set\(|\bcookies\.set\(|\.cookie\(|\.set_cookie\(|\bsetCookie\(\s*\w+\s*,|(?<![.\w])serialize\(|\bcookie\.serialize\()\s*(?:key\s*=\s*)?(?:["'`](?![^"'`\n]{0,60}?(?i:csrf|xsrf))[^"'`\n]{0,60}?(?i:session|\bsid\b|auth|token|jwt|refresh|remember)|(?![A-Z0-9_]{0,40}(?:CSRF|XSRF))[A-Z0-9_]{0,40}(?:SESSION|AUTH|TOKEN|SID|JWT|REMEMBER))[^;)]{0,300}?(?i:\bhttp_?only)[\"'`]?\s*[:=]\s*[\"'`]?(?i:false|nil)\b)(?:(?=[\s\S]*?(?i:httponly))(?=[\s\S]*?(?i:\bsecure\b|__Host-|__Secure-))(?=[\s\S]*?(?i:samesite))|[\s\S]*?(?:[(,]|\.\.\.|\*\*)\s*(?=[a-z_$])[\w$.]{0,40}?(?i:cookie)_?(?i:options|opts|attributes|attrs|config|defaults)\b)'''
paths = ["*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,py,rb,php,go}"]
say = "Build this session cookie with Secure, HttpOnly and SameSite=Lax (or Strict), and name it with the __Host- prefix (Path=/, no Domain) (SEC-34). If the flags come from a shared options object, name it like `sessionCookieOptions`, or add `practices-allow: SEC-34 flags set in <module>`."

[[rule]]
# jsonwebtoken's decode and jose's decodeJwt read claims without checking anything. A file that
# also verifies (decode to read the kid header, then verify) or a client component stays quiet.
id = "SEC-35"
when = '''\bjwt\.decode\(|(?<![\w])(?:decodeJwt|jwtDecode|jwt_decode)(?:<[^<>\n]{1,80}>)?\('''
unless = '''\bjwt\.verify\(|\bjwtVerify\(|^\s*["']use client["']'''
paths = ["*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}"]
say = "Verify this JWT before trusting a claim: `jwt.verify` or jose's `jwtVerify` with a key from a trusted source, an `algorithms` allowlist and `exp`, `iss` and `aud` checks; decode checks nothing (SEC-35). If this only reads claims for display, add `practices-allow: SEC-35 display only`."

[[rule]]
id = "SEC-35-alg"
when = '''\bjwt\.verify\('''
unless = '''\balgorithms\s*:'''
paths = ["*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}"]
say = "Pass an `algorithms` allowlist to jwt.verify (such as `{ algorithms: [\"HS256\"] }` or `[\"RS256\"]`), so a token can't pick its own algorithm (SEC-35)."

[[rule]]
id = "SEC-35-off"
when = '''["']?verify_(?:signature|exp|aud|iss)["']?\s*:\s*False\b|\bjwt\.decode\([^\n]{0,200}\bverify\s*=\s*False\b|\bignoreExpiration\s*:\s*true\b|\balgorithms\s*[:=]\s*\[[^\]\n]{0,100}["'](?i:none)["']'''
paths = ["*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,py}"]
say = "Never turn off JWT checks: keep the signature, expiry and audience verified, and never allow the `none` algorithm (SEC-35). A test that builds a deliberately bad token can add `practices-allow: SEC-35-off test fixture`."

[[rule]]
# A weak generator in the value given to a name that says token, code, nonce or secret: an
# assignment, an object key or a call's argument, up to the next statement or key, so
# { id: crypto.randomUUID(), tokens } stays quiet. A UUID for a CSP nonce (Next's documented
# Buffer.from(crypto.randomUUID())) is a CSPRNG value and stays quiet too.
id = "SEC-36"
when = '''(?<![\w$])[\w$]{0,40}?(?i:token|nonce|secret|passcode|csrf|api_?key|session_?id|magic_?link|invite_?code|reset_?code|verification_?code|\botp|otp\b|\bsalt\b|\bcode\b|(?:sms|email|mfa|login|confirm\w{0,8})_?code)[\w$]{0,40}(?:[\"'`]?\s*[:=](?![=>])|\s*\()[^\n;,]{0,120}?(?:,[^\n;,:]{0,60}?)?(?:\bMath\.random\(|\brandom\.(?:random|randint|choice|choices|randrange|getrandbits|sample)\(|\bDate\.now\(\)\s*\.toString\()|(?<![\w$])(?![\w$]{0,40}(?i:nonce))[\w$]{0,40}?(?i:token|nonce|secret|passcode|csrf|api_?key|session_?id|magic_?link|invite_?code|reset_?code|verification_?code|\botp|otp\b|\bsalt\b|\bcode\b|(?:sms|email|mfa|login|confirm\w{0,8})_?code)[\w$]{0,40}(?:[\"'`]?\s*[:=](?![=>])|\s*\()[^\n;,]{0,120}?(?:,[^\n;,:]{0,60}?)?(?:\bcrypto\.randomUUID\(|(?<![.\w])(?:uuidv4|uuid4)\(|\buuid\.v4\(|\buuid\.uuid4\()'''
paths = ["*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,py}"]
say = "Build this token from a CSPRNG at 128 bits or more (`crypto.randomBytes(32).toString(\"base64url\")`, `secrets.token_urlsafe(32)`), never Math.random, random, a timestamp or a UUID; store only its hash, expire it soon and consume it on first use (SEC-36)."

[[rule]]
# A direct write of an email or phone to an existing account: an ORM update, a SQL UPDATE or an
# assignment on the current user, or a call (not a definition) of updateEmail, which switches
# at once in Firebase. Boolean values (a notification toggle) don't fire. A file that names a
# pending-change table or Firebase's verifyBeforeUpdateEmail stays quiet; a form handler
# such as handleEmailChange does not count.
id = "SEC-37"
when = '''\.update(?:Many)?\(\s*\{[^;]{0,300}?\bdata\s*:\s*\{[^}]{0,200}?\b(?:email|phone|phoneNumber|phone_number)\b\s*(?:[,}]|:(?!\s*(?:true|false|null)\b))|\.set\(\s*\{[^{}]{0,200}?\b(?:email|phone|phoneNumber|phone_number)\b\s*(?:[,}]|:(?!\s*(?:true|false|null)\b))|\.update\(\s*\{(?!\s*where\b)[^{}]{0,200}?\b(?:email|phone|phoneNumber|phone_number)\b\s*(?:[,}]|:(?!\s*(?:true|false|null)\b))|\$set\s*:\s*\{[^{}]{0,200}?\b(?:email|phone|phoneNumber|phone_number)\b\s*(?:[,}]|:(?!\s*(?:true|false|null)\b))|(?i:\bUPDATE\s+["`]?\w+["`]?\s+SET\s+(?:[^;]{0,200}?,\s*)?(?:\w+\.)?["`]?(?:email|phone|phone_number)["`]?\s*=)|\b(?:request\.user|current_user|currentUser|self\.request\.user)\.(?:email|phone|phone_number|phoneNumber)\s*=(?!=)|\b(?:current_user|request\.user)\.update!?\([^\n]{0,100}\b(?:email|phone):|(?<!function )(?<![\w])updateEmail\((?![^)\n]{0,200}\)\s*(?::\s*[^{\n]{1,80})?\{)'''
unless = '''(?i:\bpending_?(?:email|phone|contact)\w{0,30}|\b(?:email|phone|contact)_?change_?(?:requests?|tokens?)\b|\b(?:email|phone)_?changes\b|\bunconfirmed_?email\b)|\bverifyBeforeUpdateEmail\b'''
paths = ["*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,py,rb,php,go,sql}"]
say = "Don't write a new email or phone to the account directly. Build a pending change: a random single-use token, stored hashed and valid 30 minutes or less, sent to the NEW address; switch only when it is followed, with a fresh sign-in to start, a notice to the old address with a link that cancels the change, a rate limit and an audit line (SEC-37, see the skill's references/email-change.md). On Firebase, use verifyBeforeUpdateEmail, never updateEmail. If this is the confirm step or an audited admin tool, add `practices-allow: SEC-37 <reason>`."

[[rule]]
# A redirect to a request-supplied value: read inside the call, or a variable named like the
# param in a file that reads the param (by name, from the body, destructured, or Rails'
# params[:next] and params.fetch(:next)). Rails' redirect_to counts with or without parens.
