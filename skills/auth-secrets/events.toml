id = "SEC-43-csp"
when = '''(?i:\b(?:default|script|connect|frame|child|worker|object)-src\b[^\n;]{0,300}?\s(?:https?://|wss?://)?\*(?:\.|[\s;"'`]|$))|(?i:\bform-action\b[^\n;]{0,300}?\s(?:https?://)?\*(?:\.|[\s;"'`]|$))|(?i:\b(?:default|script|connect|frame|child|worker|object)Src\b\s*:\s*\[[^\]]{0,300}?["'`](?:https?://|wss?://)?\*(?:\.|["'`]))'''
