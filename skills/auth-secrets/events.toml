paths = ["*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,py,rb,php,go}"]
say = "A wildcard or reflected origin with credentials lets any site read your users' data. Build a fixed allowlist of origins and echo the request's Origin only when it is on that list (SEC-43)."

[[rule]]
# A wildcard source in a CSP directive that can load code or send data. A helmet directive
