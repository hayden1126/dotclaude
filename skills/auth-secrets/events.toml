say = "Build a same-origin validator for this redirect target: refuse a non-string, a backslash or any control character, parse it against the configured origin, compare origins, and redirect to the validated absolute URL, never a string starting with // (SEC-39, see the skill's references/redirects.md). If the code already has, or the task names, its own validator, keep that name and route the value through it: wrap the read in the call, or assign the call's result and redirect to that."

[[rule]]
# A public-prefixed name holding a secret. A vendor name counts only before KEY, TOKEN or SECRET,
# PRIVATE only as PRIVATE_KEY and PASSWORD only at the end, so NEXT_PUBLIC_OTP_RESEND_SECONDS,
# NEXT_PUBLIC_PRIVATE_BETA and NEXT_PUBLIC_PASSWORD_MIN_LENGTH stay quiet.
id = "SEC-40"
when = '''\b(?:NEXT_PUBLIC|VITE|PUBLIC|EXPO_PUBLIC|REACT_APP|NUXT_PUBLIC|GATSBY)_[A-Z0-9_]{0,40}(?:SECRET|SERVICE_ROLE|SERVICE_KEY|PRIVATE_KEY|ADMIN_KEY|ADMIN_TOKEN|PASSWORD\b|DATABASE_URL|(?:OPENAI|ANTHROPIC|RESEND|SENDGRID|MAILGUN|POSTMARK|TWILIO)[A-Z0-9_]{0,20}(?:KEY|TOKEN|SECRET))'''
paths = ["*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,vue,svelte,astro,json,yaml,yml,toml}", ".env*"]
say = "A NEXT_PUBLIC_, VITE_ or PUBLIC_ variable is built into the browser bundle, so a secret in one is public. Keep this key server-only under a name without the public prefix, and call the service from server code (SEC-40). If the value is truly public (a publishable key), rename it to say so."

[[rule]]
# A service-role key, an admin SDK or a server secret in a "use client" file.
id = "SEC-40-client"
when = '''\bSERVICE_ROLE\w{0,30}|(?:\bfrom\s|\brequire\(\s*)\s*["'](?:firebase-admin|firebase-admin/[\w-]+|stripe)["']|\bprocess\.env\.(?!NEXT_PUBLIC_|VITE_|PUBLIC_|EXPO_PUBLIC_|REACT_APP_)[A-Z0-9_]{0,40}(?:SECRET|PRIVATE|SERVICE_ROLE|(?<![A-Z])KEY)'''
unless = '''\A(?![\s\S]{0,500}?^\s*["']use client["'])'''
paths = ["*.{ts,tsx,js,jsx,mjs}"]
say = "This client component reaches for a privileged key or an admin SDK. Move the call to a server action or route that does its own authorization, and keep the key server-only (SEC-40, server-code SEC-01)."

[[rule]]
# Key shapes from the vendors' published formats: AWS access key ids, GitHub tokens, Slack
# tokens, OpenAI-style and Stripe secret keys, and PEM private-key headers. Placeholders with
# XXXX and AWS's documented EXAMPLE ids stay quiet. practices-allow covers only its own line.
id = "SEC-41"
at = ["edit", "commit"]
scope = "line"
when = '''\b(?:AKIA|ASIA)(?![A-Z0-9]{0,12}XXXX)[A-Z0-9]{16}\b(?<!EXAMPLE)|\bgh[pousr]_[A-Za-z0-9]{36,251}\b|\bgithub_pat_[A-Za-z0-9_]{80,251}\b|\bxox[abeoprs]-[0-9]{6,16}-[0-9A-Za-z-]{8,200}|\bsk-(?:(?:proj|svcacct|admin)-)?[A-Za-z0-9_-]{16,160}T3BlbkFJ[A-Za-z0-9_-]{16,160}|\bsk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{80,300}|\bsk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_-]{80,200}|\b[rs]k_(?:live|test)_(?![A-Za-z0-9]{0,250}?(?:xxxx|XXXX))[A-Za-z0-9]{20,250}\b|-{5}BEGIN[ ](?:[A-Z0-9]{2,10}[ ])?PRIVATE[ ]KEY(?:[ ]BLOCK)?-{5}'''
paths = ["*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,py,rb,go,php,java,kt,cs,rs,swift,vue,svelte,astro,html,json,yaml,yml,toml,ini,cfg,conf,xml,properties,tf,tfvars,sh,bash,zsh,ps1,md,mdx,txt,ipynb}", "Dockerfile", "*.dockerfile", ".env.{example,sample,template,dist,defaults}"]
say = "This looks like a live key. Read it from env or a secret manager instead, and if it is real, tell the user to rotate it: it has left the vault (SEC-41). A fake key in a test fixture can stay with `practices-allow: SEC-41 fake test key` on the same line; the comment covers only that line."

[[rule]]
# A .env file holding a secret, at commit time only: writing one locally is how env works.
id = "SEC-41-env"
at = ["commit"]
when = '''^\s*(?:export\s+)?[A-Z0-9_]{0,60}(?:SECRET|TOKEN|PASSWORD|PRIVATE|CREDENTIAL|(?<![A-Z])KEY)[A-Z0-9_]{0,40}\s*=\s*["']?[^\s"'#]{8,}'''
paths = [".env", ".env.local", ".env.*.local", ".env.{development,production,test,staging,preview}", "*.env"]
say = "Don't commit this env file: add it to .gitignore, take it out of the commit (`git rm --cached <file>`), commit a .env.example with empty values instead, and tell the user to rotate any real secret it held (SEC-41)."

[[rule]]
# A secret env read with a literal fallback: the fallback ships when the variable is unset.
id = "SEC-41-fallback"
when = '''\b(?:process\.env|import\.meta\.env)\.[A-Z0-9_]{0,60}(?:SECRET|TOKEN|PASSWORD|PRIVATE|(?<![A-Z])KEY)[A-Z0-9_]{0,40}\s*(?:\?\?|\|\|)\s*["'`][^"'`\n]{1,200}["'`]|\bos\.(?:getenv|environ\.get)\(\s*["'][A-Z0-9_]{0,60}(?:SECRET|TOKEN|PASSWORD|PRIVATE|(?<![A-Z])KEY)[A-Z0-9_]{0,40}["']\s*,\s*["'][^"'\n]{1,200}["']'''
paths = ["*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,py}"]
say = "Drop the literal fallback for this secret: when the variable is unset, the app would run with a value anyone can read in the source. Fail closed at startup instead (SEC-41, server-code SEC-08)."

[[rule]]
id = "SEC-42"
when = '''(?<![.\w])createCipher\(|\bcrypto\.createCipher\(|(?<![.\w])createDecipher\(|\bcrypto\.createDecipher\(|(?i:["'](?:aes|aes-?\d{3})-ecb["'])|\bAES\.MODE_ECB\b|\bmodes\.ECB\(|["']AES/ECB/|\bCipher\.getInstance\(\s*"AES"\s*\)|(?i:["'](?:des-cbc|des-ede|des-ede3|des-ede3-cbc|des3|rc4|rc2|bf-cbc|blowfish)["'])|\b(?:DES|DES3|ARC4|ARC2|Blowfish)\.new\('''
paths = ["*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,py,rb,php,go,java,kt,cs}"]
say = "Use vetted crypto: AES-256-GCM (`createCipheriv(\"aes-256-gcm\", key, iv)` with a fresh 12-byte IV per message) or ChaCha20-Poly1305, or libsodium; never ECB, createCipher, DES, RC4 or Blowfish (SEC-42)."

[[rule]]
# A wildcard or reflected CORS origin in a file that also turns on credentials.
id = "SEC-43"
when = '''(?i:access-control-allow-origin)["'`]?\s*[:,]\s*["'`]\*["'`]|\borigin\s*:\s*(?:["'`]\*["'`]|true\b)|\ballow_origins\s*=\s*\[\s*["']\*["']\s*\]|\bCORS_(?:ALLOW_ALL_ORIGINS|ORIGIN_ALLOW_ALL)\s*=\s*True\b|(?i:access-control-allow-origin)["'`]?\s*,\s*(?:req|request)\.headers(?:\.origin\b|\[\s*["'`]origin["'`]|\.get\(\s*["'`]origin["'`])|\borigin\s*:\s*\(\s*\w*\s*,\s*(?:cb|callback|done)\s*\)\s*=>\s*(?:cb|callback|done)\(\s*null\s*,\s*true\s*\)|\bCORS\((?![^\n)]{0,200}\borigins\s*=)[^\n)]{0,200}\bsupports_credentials\s*=\s*True\b'''
