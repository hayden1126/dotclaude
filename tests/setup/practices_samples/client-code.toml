# Samples for skills/client-code/events.toml: for LEG-01 and UX-63, code that must fire and near
# misses that must not. The practices engine test runs each one. kind = "rule" is an edit to
# `path` that writes `content`.

# ---------------------------------------------------------------- LEG-01: trackers that must fire

[[sample]]
kind = "rule"
id = "LEG-01"
fires = true
path = "app/layout.tsx"
content = '''
<script dangerouslySetInnerHTML={{ __html: "window.dataLayer=[];function g(){};gtag('config','G-1');" }} />
'''

