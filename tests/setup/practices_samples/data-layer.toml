# Samples for skills/data-layer/events.toml: for REL-31, migrations that must fire and near
# misses that must not. The practices engine test runs each one. kind = "rule" is an edit to
# `path` that writes `content`; kind = "bash" is a Bash call whose command is `content`. Keep
# `rename` and `drop` out of the paths: settings.json's filter would pass on the path alone, and
# the test tying the filter to these samples would stop checking the statement.

