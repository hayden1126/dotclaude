# A line that starts as a comment never fires, whatever it names: the first step of an
# add-then-remove says what a later release will drop. A comment after a statement does.

[[sample]]
kind = "rule"
id = "REL-31"
fires = false
path = "supabase/migrations/20261107120000_users.sql"
