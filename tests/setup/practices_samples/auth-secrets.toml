# Samples for skills/auth-secrets/events.toml: for every event and rule, edits that must
# fire and near misses that must not. The practices engine test runs each one.
# `{key:aws}`, `{key:github}`, `{key:slack}`, `{key:openai}`, `{key:stripe}` and `{key:pem}`
# stand for key-shaped values that the test builds at run time, so no file in this repo
# holds one.

